<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">RepoScope architecture</title><desc id="desc">Browser and CLI requests enter FastAPI, which retrieves GitHub data, caches it, computes repository analytics, optionally requests LLM insights, and produces dashboards and reports.</desc>
<defs><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.t{font:600 19px Arial,sans-serif;fill:#0f172a}.s{font:14px Arial,sans-serif;fill:#475569}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs>
<rect class="b" x="30" y="145" width="150" height="90"/><text class="t" x="105" y="180" text-anchor="middle">Browser / CLI</text><text class="s" x="105" y="207" text-anchor="middle">repository input</text>
<rect class="b" x="235" y="145" width="170" height="90"/><text class="t" x="320" y="180" text-anchor="middle">FastAPI</text><text class="s" x="320" y="207" text-anchor="middle">RepoProfile API</text>
<rect class="b" x="465" y="45" width="180" height="90"/><text class="t" x="555" y="80" text-anchor="middle">GitHub REST API</text><text class="s" x="555" y="107" text-anchor="middle">paged activity data</text>
<rect class="b" x="465" y="165" width="180" height="90"/><text class="t" x="555" y="200" text-anchor="middle">Analytics</text><text class="s" x="555" y="227" text-anchor="middle">health, bus factor, trends</text>
<rect class="b" x="465" y="285" width="180" height="90"/><text class="t" x="555" y="320" text-anchor="middle">TTL Cache</text><text class="s" x="555" y="347" text-anchor="middle">rate-limit friendly</text>
<rect class="b" x="720" y="95" width="190" height="90"/><text class="t" x="815" y="130" text-anchor="middle">Insight Layer</text><text class="s" x="815" y="157" text-anchor="middle">local + optional LLM</text>
<rect class="b" x="720" y="235" width="190" height="90"/><text class="t" x="815" y="270" text-anchor="middle">Reporting</text><text class="s" x="815" y="297" text-anchor="middle">HTML + JSON</text>
<rect class="b" x="980" y="165" width="180" height="90"/><text class="t" x="1070" y="200" text-anchor="middle">Dashboard</text><text class="s" x="1070" y="227" text-anchor="middle">explainable output</text>
