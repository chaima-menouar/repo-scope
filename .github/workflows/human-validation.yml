name: RepoScope Human Validation

on:
  workflow_dispatch:
  push:
    branches:
      - improve/portfolio-ai-cloud
    paths:
      - repo-scope/data/repo_risk_human_review_decisions.csv
      - repo-scope/scripts/review_human_labels.py
      - repo-scope/scripts/adjudicate_human_reviews.py
      - repo-scope/scripts/report_reviewer_agreement.py
      - repo-scope/scripts/compare_human_weak_labels.py
      - repo-scope/scripts/merge_human_labels.py
      - repo-scope/scripts/evaluate_model_readiness.py
      - .github/workflows/human-validation.yml

permissions:
  contents: write

concurrency:
  group: reposcope-human-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-human-evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo-scope

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repo-scope/pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Audit independent reviewer agreement
        run: python scripts/report_reviewer_agreement.py

      - name: Adjudicate independent human reviews
        run: python scripts/adjudicate_human_reviews.py

      - name: Merge adjudicated labels with weak-label dataset
        run: python scripts/merge_human_labels.py

      - name: Compare weak labels with adjudicated human labels
        run: python scripts/compare_human_weak_labels.py

      - name: Refresh combined dataset quality report
        run: >-
          python scripts/report_dataset_quality.py
          --training data/repo_risk_training_combined_100k.csv
          --output data/repo_risk_100k_quality.json

      - name: Refresh model readiness
        run: python scripts/evaluate_model_readiness.py

      - name: Run human-validation tests
        run: >-
          python -m pytest -q
          tests/test_human_labels.py
          tests/test_human_review_cli.py
          tests/test_human_review_adjudication.py
          tests/test_reviewer_agreement.py

      - name: Commit refreshed human-validation artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/repo_risk_human_labels.csv \
            data/repo_risk_human_reviewer_agreement.json \
            data/repo_risk_human_weak_comparison.json \
            data/repo_risk_training_combined_100k.csv \
            data/repo_risk_100k_quality.json \
            models/repo_risk_100k_readiness.json
          if git diff --cached --quiet; then
            echo "No human-validation artifacts changed."
            exit 0
          fi
          git commit -m "data: refresh human validation evidence"
          git push
