name: Dataset bootstrap

on:
  push:
    branches: [improve/portfolio-ai-cloud]
    paths:
      - "repo-scope/data/seed_repositories.txt"
      - "repo-scope/scripts/collect_training_data.py"
      - "repo-scope/.gitignore"
      - ".github/workflows/dataset.yml"
  workflow_dispatch:

concurrency:
  group: reposcope-dataset-bootstrap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo-scope
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/portfolio-ai-cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repo-scope/pyproject.toml
      - name: Install RepoScope
        run: pip install -e .
      - name: Collect repository snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MAX_PAGES: "2"
        run: python scripts/collect_training_data.py
      - name: Commit refreshed dataset
        run: |
          if [ -z "$(git status --porcelain -- data/repo_risk_unlabelled.csv)" ]; then
            echo "Dataset unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/repo_risk_unlabelled.csv
          git commit -m "data: refresh repository risk snapshots [skip ci]"
          git pull --rebase origin improve/portfolio-ai-cloud
          git push origin HEAD:improve/portfolio-ai-cloud
