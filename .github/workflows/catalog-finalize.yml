name: Finalize 60k Catalog

on:
  push:
    branches: [improve/portfolio-ai-cloud]
    paths:
      - ".github/catalog-finalize-trigger.txt"
      - ".github/workflows/catalog-finalize.yml"
  workflow_dispatch:

concurrency:
  group: reposcope-catalog-finalize-v1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: repo-scope
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/portfolio-ai-cloud

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repo-scope/pyproject.toml

      - name: Install RepoScope with ML dependencies
        run: pip install -e ".[ml]"

      - name: Advance catalog directly to 60k
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/collect_repository_catalog.py \
            --target 60000 \
            --output data/repository_catalog_100k.csv \
            --state data/repository_catalog_100k.state.json \
            --max-new 10000

      - name: Verify exactly the requested milestone
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('data/repository_catalog_100k.csv')
          with path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          unique = {row.get('repo', '').strip() for row in rows if row.get('repo', '').strip()}
          if len(rows) != len(unique):
              raise SystemExit(f'duplicate catalog rows detected: rows={len(rows)} unique={len(unique)}')
          if len(rows) != 60000:
              raise SystemExit(f'catalog target not reached: {len(rows)}/60000')
          print({'catalog_rows': len(rows), 'unique_repositories': len(unique)})
          PY

      - name: Refresh dataset quality report at 60k
        run: |
          python scripts/report_dataset_quality.py \
            --catalog data/repository_catalog_100k.csv \
            --training data/repo_risk_training_combined_100k.csv \
            --output data/repo_risk_100k_quality.json

      - name: Update final progress summary without changing deep data
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          progress_path = Path('data/repo_risk_100k_progress.json')
          payload = json.loads(progress_path.read_text(encoding='utf-8')) if progress_path.exists() else {}
          with Path('data/repository_catalog_100k.csv').open(encoding='utf-8', newline='') as handle:
              catalog_rows = sum(1 for _ in csv.DictReader(handle))
          payload['catalog_target'] = 60000
          payload['catalog_repositories'] = catalog_rows
          payload['collection_status'] = 'stopped_at_requested_60k_catalog_milestone'
          payload['retrain_policy'] = 'final_refresh_at_stopped_60k_milestone_then_manual_only'
          progress_path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(payload)
          PY

      - name: Benchmark final stopped dataset
        run: |
          python scripts/benchmark_risk_models.py \
            data/repo_risk_training_combined_100k.csv \
            --output models/repo_risk_100k_benchmark.json

      - name: Retrain final experimental model on all current labels
        run: |
          python scripts/train_risk_model.py \
            data/repo_risk_training_combined_100k.csv \
            --output models/repo_risk_100k.joblib \
            > models/repo_risk_100k_metrics.json

      - name: Refresh model card and readiness
        run: |
          python scripts/generate_model_card.py \
            --progress data/repo_risk_100k_progress.json \
            --quality data/repo_risk_100k_quality.json \
            --metrics models/repo_risk_100k_metrics.json \
            --output models/repo_risk_100k_model_card.md
          python scripts/evaluate_model_readiness.py \
            --progress data/repo_risk_100k_progress.json \
            --quality data/repo_risk_100k_quality.json \
            --metrics models/repo_risk_100k_metrics.json \
            --human-comparison data/repo_risk_human_weak_comparison.json \
            --output models/repo_risk_100k_readiness.json

      - name: Commit final 60k catalog and aligned ML reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/repository_catalog_100k.csv \
            data/repository_catalog_100k.state.json \
            data/repo_risk_100k_progress.json \
            data/repo_risk_100k_quality.json \
            models/repo_risk_100k_benchmark.json \
            models/repo_risk_100k.joblib \
            models/repo_risk_100k_metrics.json \
            models/repo_risk_100k_model_card.md \
            models/repo_risk_100k_readiness.json
          if git diff --cached --quiet; then
            echo "Catalog and final ML reports already aligned at the requested 60k milestone"
            exit 0
          fi
          git commit -m "ml: finalize stopped 60k dataset and experimental model [skip ci]"
          git pull --rebase origin improve/portfolio-ai-cloud
          git push origin HEAD:improve/portfolio-ai-cloud
