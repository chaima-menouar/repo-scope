name: Deep Dataset and ML

on:
  push:
    branches: [improve/portfolio-ai-cloud]
    paths:
      - ".github/deep-dataset-trigger.txt"
  workflow_dispatch:

concurrency:
  group: reposcope-deep-dataset-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deep-collect-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: repo-scope
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/portfolio-ai-cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repo-scope/pyproject.toml
      - name: Install RepoScope with ML dependencies
        run: pip install -e ".[ml]"

      - name: Report dataset authentication mode
        env:
          HAS_DATA_TOKEN: ${{ secrets.REPOSCOPE_DATA_GITHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_DATA_TOKEN" = "true" ]; then
            echo "Using dedicated RepoScope data token for cross-repository public API collection"
          else
            echo "Using built-in GitHub Actions token/public fallback; collector will honor real response rate-limit headers"
          fi

      - name: Derive targeted deep-analysis manifest
        run: |
          WATCH=$(python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('data/repo_risk_training_combined_100k.csv')
          if not path.exists():
              print(0)
          else:
              with path.open(encoding='utf-8', newline='') as handle:
                  print(sum(1 for row in csv.DictReader(handle) if (row.get('label') or '').strip() == 'watch'))
          PY
          )
          if [ "$WATCH" -lt 20 ]; then
            ARCHIVED_FRACTION=0.10
            STALE_FRACTION=0.75
            STALE_DAYS=180
            echo "watch support is $WATCH; prioritizing stale-active repositories"
          else
            ARCHIVED_FRACTION=0.20
            STALE_FRACTION=0.35
            STALE_DAYS=365
          fi
          python scripts/build_deep_manifest.py \
            --catalog data/repository_catalog_100k.csv \
            --output data/seed_repositories_100k.txt \
            --target 10000 \
            --archived-fraction "$ARCHIVED_FRACTION" \
            --stale-active-fraction "$STALE_FRACTION" \
            --stale-after-days "$STALE_DAYS"

      - name: Collect next deep repository batch
        env:
          GITHUB_TOKEN: ${{ secrets.REPOSCOPE_DATA_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_MAX_PAGES: "1"
        run: |
          python scripts/collect_training_data.py \
            --repos data/seed_repositories_100k.txt \
            --catalog data/repository_catalog_100k.csv \
            --output data/repo_risk_unlabelled_100k.csv \
            --workers 4 \
            --resume \
            --limit 120 \
            --checkpoint-every 20

      - name: Reject dataset regressions
        run: |
          python scripts/validate_dataset_progress.py \
            --progress data/repo_risk_100k_progress.json \
            --catalog data/repository_catalog_100k.csv \
            --deep data/repo_risk_unlabelled_100k.csv

      - name: Rebuild labels and human-review artifacts
        run: |
          python scripts/bootstrap_weak_labels.py --input data/repo_risk_unlabelled_100k.csv --output data/repo_risk_training_100k.csv
          python scripts/export_label_review_queue.py --input data/repo_risk_unlabelled_100k.csv --output data/repo_risk_human_review_queue.csv --limit 250
          python scripts/merge_human_labels.py --unlabelled data/repo_risk_unlabelled_100k.csv --weak data/repo_risk_training_100k.csv --human data/repo_risk_human_labels.csv --output data/repo_risk_training_combined_100k.csv
          python scripts/compare_human_weak_labels.py --weak data/repo_risk_training_100k.csv --human data/repo_risk_human_labels.csv --output data/repo_risk_human_weak_comparison.json
          python scripts/report_dataset_quality.py --catalog data/repository_catalog_100k.csv --training data/repo_risk_training_combined_100k.csv --output data/repo_risk_100k_quality.json

      - name: Benchmark and train when class support is ready
        run: |
          read ROWS PREVIOUS HEALTHY WATCH RISKY <<EOF
          $(python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path
          training = Path('data/repo_risk_training_combined_100k.csv')
          rows_data = list(csv.DictReader(training.open(encoding='utf-8'))) if training.exists() else []
          counts = Counter((row.get('label') or '').strip() for row in rows_data)
          progress = Path('data/repo_risk_100k_progress.json')
          previous = 0
          if progress.exists():
              try: previous = int(json.loads(progress.read_text()).get('labelled_snapshots', 0))
              except Exception: previous = 0
          print(len(rows_data), previous, counts.get('healthy',0), counts.get('watch',0), counts.get('risky',0))
          PY
          )
          EOF
          if [ "$HEALTHY" -ge 10 ] && [ "$WATCH" -ge 10 ] && [ "$RISKY" -ge 10 ]; then
            python scripts/benchmark_risk_models.py data/repo_risk_training_combined_100k.csv --output models/repo_risk_100k_benchmark.json
          fi
          SHOULD_TRAIN=0
          if [ "$HEALTHY" -ge 20 ] && [ "$WATCH" -ge 20 ] && [ "$RISKY" -ge 20 ]; then
            if [ "$ROWS" -ge 200 ] && [ ! -f models/repo_risk_100k.joblib ]; then SHOULD_TRAIN=1; fi
            if [ "$ROWS" -ge 500 ] && [ $((ROWS / 500)) -gt $((PREVIOUS / 500)) ]; then SHOULD_TRAIN=1; fi
          fi
          if [ "$SHOULD_TRAIN" -eq 1 ]; then
            python scripts/train_risk_model.py data/repo_risk_training_combined_100k.csv --output models/repo_risk_100k.joblib > models/repo_risk_100k_metrics.json
          else
            echo "scaled model refresh not yet eligible"
          fi

      - name: Write progress, model card and readiness
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          def count(path):
              p=Path(path)
              if not p.exists(): return 0
              with p.open(encoding='utf-8', newline='') as f: return sum(1 for _ in csv.DictReader(f))
          payload={
            'catalog_target':100000,
            'catalog_repositories':count('data/repository_catalog_100k.csv'),
            'deep_profile_target':10000,
            'deep_snapshots':count('data/repo_risk_unlabelled_100k.csv'),
            'labelled_snapshots':count('data/repo_risk_training_combined_100k.csv'),
            'weak_labelled_snapshots':count('data/repo_risk_training_100k.csv'),
            'human_reviewed_snapshots':count('data/repo_risk_human_labels.csv'),
            'human_review_queue':count('data/repo_risk_human_review_queue.csv'),
            'label_type':'weak_labels_plus_optional_durable_human_review',
            'quality_report':'data/repo_risk_100k_quality.json',
            'human_weak_comparison':'data/repo_risk_human_weak_comparison.json',
            'benchmark_report':'models/repo_risk_100k_benchmark.json',
            'model_status':'experimental_weak_supervision',
            'retrain_policy':'all_classes_min_20_first_model_at_200_then_each_500_label_milestone',
          }
          Path('data/repo_risk_100k_progress.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(payload)
          PY
          if [ -f models/repo_risk_100k_metrics.json ]; then
            python scripts/generate_model_card.py --progress data/repo_risk_100k_progress.json --quality data/repo_risk_100k_quality.json --metrics models/repo_risk_100k_metrics.json --output models/repo_risk_100k_model_card.md
          fi
          python scripts/evaluate_model_readiness.py --progress data/repo_risk_100k_progress.json --quality data/repo_risk_100k_quality.json --metrics models/repo_risk_100k_metrics.json --human-comparison data/repo_risk_human_weak_comparison.json --output models/repo_risk_100k_readiness.json

      - name: Commit deep dataset progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/seed_repositories_100k.txt data/repo_risk_unlabelled_100k.csv data/repo_risk_training_100k.csv data/repo_risk_training_combined_100k.csv data/repo_risk_human_review_queue.csv data/repo_risk_human_labels.csv data/repo_risk_human_weak_comparison.json data/repo_risk_100k_quality.json data/repo_risk_100k_progress.json models/repo_risk_100k_readiness.json
          if [ -f models/repo_risk_100k_benchmark.json ]; then git add -f models/repo_risk_100k_benchmark.json; fi
          if [ -f models/repo_risk_100k.joblib ]; then git add -f models/repo_risk_100k.joblib models/repo_risk_100k_metrics.json; fi
          if [ -f models/repo_risk_100k_model_card.md ]; then git add -f models/repo_risk_100k_model_card.md; fi
          if git diff --cached --quiet; then echo "Deep dataset progress unchanged"; exit 0; fi
          git commit -m "ml: advance deep repository dataset [skip ci]"
          git pull --rebase origin improve/portfolio-ai-cloud
          git push origin HEAD:improve/portfolio-ai-cloud
