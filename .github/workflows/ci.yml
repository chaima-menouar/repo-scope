name: RepoScope CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo-scope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repo-scope/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,ml]"
      - name: Lint
        run: ruff check src tests app.py scripts
      - name: Tests
        run: pytest
      - name: Docker build
        run: docker build -t repo-scope-ci .
